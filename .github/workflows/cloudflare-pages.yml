name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project name
        id: cfg
        run: |
          NAME="${{ vars.CF_PROJECT }}"
          if [ -z "$NAME" ]; then
            echo "::error::Repo variable CF_PROJECT is not set."
            exit 1
          fi
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $NAME"

      # Copy only site content into dist/ — never dotfiles, tokens, or CI config.
      - name: Stage site
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '.gitignore' \
            --exclude '*.token'
          test ! -e dist/cloudflare.token
          ls -la dist

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.cfg.outputs.project }} --branch=main
